# mirafleet actions-mode runner. See README.md. Join once, then: docker compose up -d
name: mirafleet-runner

services:
  runner:
    image: ${MIRAFLEET_IMAGE:-docker.io/mirastack/mirafleet:0.5.0}
    command: ["runner", "run", "-data", "/var/lib/mirafleet/runner", "-actions", "/etc/mirafleet/actions.yaml"]
    volumes:
      - runner-data:/var/lib/mirafleet
      - ./actions.yaml:/etc/mirafleet/actions.yaml:ro
    restart: unless-stopped

volumes:
  runner-data:
