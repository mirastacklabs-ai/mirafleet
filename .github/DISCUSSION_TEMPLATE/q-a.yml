title: "Q: "
body:
  - type: markdown
    attributes:
      value: |
        Check the [quickstart](https://github.com/mirastacklabs-ai/mirafleet/blob/main/docs/QUICKSTART.md)
        and the [developer guide](https://github.com/mirastacklabs-ai/mirafleet/blob/main/docs/guide/README.md) first.
        Never paste tokens, keys, registration codes or real hostnames. Security problems go to
        [private reporting](https://github.com/mirastacklabs-ai/mirafleet/security/advisories/new).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what happened?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Version and setup
      description: Output of `mirafleet version`, your OS, and your harness.
      placeholder: 0.6.0, Ubuntu 24.04 central, macOS laptop, Claude Code
    validations:
      required: false
