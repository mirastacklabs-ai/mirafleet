title: "Idea: "
body:
  - type: markdown
    attributes:
      value: |
        mirafleet stays lean. Enterprise features (RBAC, SSO, HA) are out of scope for the open
        source tree. See the [plan](https://github.com/mirastacklabs-ai/mirafleet/blob/main/docs/PLAN.md).
        A well-shaped idea can become a feature request issue.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
