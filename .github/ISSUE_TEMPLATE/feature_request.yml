name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        mirafleet stays lean. Enterprise features (RBAC, SSO, HA) are out of scope for the open
        source tree. Search existing
        [issues](https://github.com/mirastacklabs-ai/mirafleet/issues) and
        [Discussions](https://github.com/mirastacklabs-ai/mirafleet/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: I searched the existing issues and Discussions.
          required: true
        - label: It needs no telemetry or unconfigured outbound connection.
          required: true
        - label: It needs no new dependency, or I explain why in the proposal.
          required: false
