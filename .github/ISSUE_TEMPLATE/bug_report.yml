name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. Use
        [private vulnerability reporting](https://github.com/mirastacklabs-ai/mirafleet/security/advisories/new).
        Never paste tokens, keys, registration codes or real hostnames.

        Setup question? Ask in [Discussions](https://github.com/mirastacklabs-ai/mirafleet/discussions).
        Testing an early build? A [test report](https://github.com/mirastacklabs-ai/mirafleet/issues/new?template=test_report.yml) fits better.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mirafleet version`.
      placeholder: 0.6.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - central
        - runner
        - mcp (orchestrator side)
        - admin GUI
        - installer or packaging
        - harness integration or plugin
        - docs
        - other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 amd64
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: Only if it matters (Claude Code, opencode, Codex, Cursor ...).
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Fleet mode
      options:
        - actions
        - workspace (container)
        - host
        - not applicable
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mirafleet central fleet create dev -mode actions
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include log output with secrets removed.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and the docs.
          required: true
        - label: I removed tokens, keys, registration codes and real hostnames from everything above.
          required: true
