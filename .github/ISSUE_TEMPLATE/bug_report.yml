name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. Use
        [private vulnerability reporting](https://github.com/mirastacklabs-ai/mirafleet/security/advisories/new).
        Never paste tokens, keys or real hostnames.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mirafleet version`.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - central
        - runner
        - mcp (orchestrator side)
        - admin GUI
        - installer or packaging
        - docs
        - other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 amd64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. mirafleet central init ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include log output with secrets removed.
      render: shell
    validations:
      required: true
