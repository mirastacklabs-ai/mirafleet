name: orchestrator

# Orchestrator-side packages (mirafleet mcp, keys, config) on the OSes where central is not built.
# Central and runner are Linux-only and are gated locally by scripts/dev.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Orchestrator packages under test. Append as they land (do not list a package before it exists).
  # M7 orchestrator side is covered: transfer lives in ./internal/orch, the remote-project hook in
  # integrations/claude-code/hook (under ./integrations/...). ./integrations/... compares file bytes,
  # so it relies on the LF checkouts that .gitattributes enforces (F-45); integrations/eol_test.go
  # guards against CRLF.
  PKGS: ./internal/keys/... ./internal/opconf/... ./internal/handoff/... ./internal/orch/... ./internal/mcpserver/... ./integrations/...

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          read -ra targets <<< "$PKGS" # PKGS is a space-separated list; split it explicitly
          go vet "${targets[@]}"
      - name: build (shipped config, CGO_ENABLED=0)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/mirafleet-bin.exe" ./cmd/mirafleet
      - name: test (CGO_ENABLED=0, as shipped)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          read -ra targets <<< "$PKGS" # PKGS is a space-separated list; split it explicitly
          go test "${targets[@]}"
      - name: test -race (CGO_ENABLED=1 because the race detector needs cgo)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          read -ra targets <<< "$PKGS" # PKGS is a space-separated list; split it explicitly
          go test -race "${targets[@]}"
      # npm launcher and Homebrew checks. node, pwsh and brew are preinstalled on the runners.
      - name: npm launcher tests
        shell: bash
        run: node --test npm/mirafleet/test/*.test.js
      - name: install.ps1 test (local HTTPS server, stand-in cosign)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 8
        run: ./scripts/release/installtest.ps1
      - name: brew style on the rendered formula
        if: runner.os == 'macOS'
        shell: bash
        run: |
          go run ./tools/relgen -root . brew -checksums tools/relgen/testdata/brew/checksums.txt -out "$RUNNER_TEMP/mirafleet.rb" v0.6.0
          brew style "$RUNNER_TEMP/mirafleet.rb"
