name: release

# Release workflow (docs/M6.md 2.16, docs/RELEASING.md). Runs only for version tags (vX.Y.Z and
# vX.Y.Z-rc.N). Tags are pushed by the user, or by an agent after the user's explicit yes
# (docs/M6.md section 8); nothing else starts this workflow.
#
# Shape: verify -> build (no credentials) -> draft -> publish-release -> image | npm | brew,
# then mcp-registry after npm. Every job that publishes or signs runs in the protected `release`
# environment, so each waits for the reviewer's approval in the GitHub UI. All secrets come from
# that environment; each credential is used by exactly one job:
#   DOCKERHUB_USERNAME (variable), DOCKERHUB_TOKEN   image
#   HOMEBREW_TAP_TOKEN                               brew
#   NPM_TOKEN (optional, first publish only)         npm
# ghcr, cosign, attestations, npm provenance and the MCP Registry use GitHub OIDC or the job's
# GITHUB_TOKEN. No long-lived token is stored in the repository. Every Action is pinned by SHA.
# Untrusted input (the tag name) reaches `run:` only through env: and is validated first.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_SLUG: mirastacklabs-ai/mirafleet
  DOCKERHUB_IMAGE: docker.io/mirastack/mirafleet
  GHCR_IMAGE: ghcr.io/mirastacklabs-ai/mirafleet

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag is a version and is on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' ||
            { echo "tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N" >&2; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main ||
            { echo "tag $TAG ($SHA) is not on main" >&2; exit 1; }
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >>"$GITHUB_OUTPUT" ;; esac
      - name: every versioned file matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/dev.sh go run ./tools/relgen check "$TAG"
      - name: required CI jobs are green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          # Names of the ci.yml jobs (and the other required checks) that must have succeeded on the
          # tagged commit. Keep in step with .github/workflows/ci.yml.
          REQUIRED: gate licenses vuln lint dist integration e2e-systemd dco
        run: |
          # Wait up to 50 minutes for slow jobs; fail at once when any required check failed.
          for _ in $(seq 1 50); do
            rows=$(gh api --paginate "repos/$REPO_SLUG/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "-")] | @tsv')
            pending=""
            for name in $REQUIRED; do
              mine=$(printf '%s\n' "$rows" | awk -F'\t' -v n="$name" '$1 == n')
              [ -n "$mine" ] || { pending="$pending $name(missing)"; continue; }
              if printf '%s\n' "$mine" | awk -F'\t' '$2 == "completed" && $3 != "success" && $3 != "skipped" {bad=1} END {exit !bad}'; then
                echo "required check failed: $name" >&2
                printf '%s\n' "$mine" >&2
                exit 1
              fi
              printf '%s\n' "$mine" | awk -F'\t' '$2 != "completed" {p=1} END {exit !p}' && pending="$pending $name"
            done
            [ -z "$pending" ] && { echo "all required checks succeeded"; exit 0; }
            echo "waiting for:$pending"
            sleep 60
          done
          echo "timed out waiting for required checks" >&2
          exit 1

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: third-party licences and staged documents
        run: |
          scripts/release.sh licenses-report
          scripts/release.sh stage
      - name: build the tools image (goreleaser, syft, cosign, nfpm; pinned)
        run: docker build -q --label org.mirastacklabs.mirafleet.release=1 -t mirafleet-release-tools:local -f scripts/release/tools.Dockerfile scripts/release
      - name: goreleaser (build, archives, packages, checksums, SBOMs; no publish, no signing)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src \
            -e HOME=/tmp -e GOFLAGS="-buildvcs=false -modcacherw" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            mirafleet-release-tools:local goreleaser release --clean --skip=publish,sign
      - name: checksums match every file they list
        working-directory: dist/goreleaser
        run: sha256sum -c checksums.txt
      - name: package and install tests on the real artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          scripts/release.sh pkgtest
          scripts/release.sh installtest
          scripts/release.sh npmtest "$PWD/dist/goreleaser" "$VERSION"
      - name: collect the release files
        run: |
          mkdir -p dist/release
          cd dist/goreleaser
          cp -- *.tar.gz *.zip *.deb *.rpm *.apk *.sbom.json checksums.txt ../release/
          cd ../..
          cp scripts/install.sh scripts/install.ps1 dist/THIRD_PARTY_LICENSES.txt dist/release/
          # every file in checksums.txt is present and nothing else is hashed
          (cd dist/release && sha256sum -c checksums.txt)
          ls -l dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: draft
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/release
      - name: checksums still match
        working-directory: dist/release
        run: sha256sum -c checksums.txt
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: cosign keyless signature of checksums.txt
        working-directory: dist/release
        run: |
          cosign sign-blob --yes checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem
      - name: the signature verifies with the exact identity install.sh requires
        working-directory: dist/release
        run: |
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig --certificate checksums.txt.pem \
            --certificate-identity-regexp '^https://github\.com/mirastacklabs-ai/mirafleet/\.github/workflows/release\.yml@refs/tags/v[0-9A-Za-z.+-]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: build provenance for archives, packages and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.deb
            dist/release/*.rpm
            dist/release/*.apk
            dist/release/checksums.txt
      - name: draft GitHub release with every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flag=""
          [ "$PRERELEASE" = true ] && flag="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$REPO_SLUG" --draft --verify-tag $flag \
            --title "mirafleet $TAG" \
            --notes "Draft. Verify the assets, then approve publish-release. See docs/RELEASING.md." \
            dist/release/*

  publish-release:
    name: publish-release
    needs: [verify, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      # Approving this job is the user's review of the draft release.
      - name: publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$REPO_SLUG" --draft=false

  image:
    name: image
    needs: [verify, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/release
      - name: build context from the verified linux archives
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd dist/release && sha256sum -c checksums.txt)
          ctx=dist/oci
          for arch in amd64 arm64; do
            mkdir -p "$ctx/linux/$arch"
            tar -xzf "dist/release/mirafleet_${VERSION}_linux_${arch}.tar.gz" -C "$ctx/linux/$arch" mirafleet
          done
          tar -xzf "dist/release/mirafleet_${VERSION}_linux_amd64.tar.gz" -C "$ctx" LICENSE NOTICE THIRD_PARTY_LICENSES.txt
      - name: tags (a pre-release gets only its own version)
        id: tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          list="$VERSION"
          if [ "$PRERELEASE" != true ]; then
            list="$list ${VERSION%.*} latest"
          fi
          {
            echo "tags<<EOF"
            for t in $list; do
              echo "$DOCKERHUB_IMAGE:$t"
              echo "$GHCR_IMAGE:$t"
            done
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: one multi-arch build, pushed once to both registries (same digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/oci
          file: packaging/oci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: cosign signatures by digest, both registries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$DOCKERHUB_IMAGE@$DIGEST"
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
      - name: build provenance, Docker Hub
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/mirastack/mirafleet
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: build provenance, ghcr
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/mirastacklabs-ai/mirafleet
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  npm:
    name: npm
    needs: [verify, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: generate the seven packages from the verified archives
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd dist/release && sha256sum -c checksums.txt)
          scripts/dev.sh go run ./tools/relgen npm -dist dist/release -out dist/npm "$VERSION" >dist/npm-dirs.txt
          cat dist/npm-dirs.txt
      - name: publish the platform packages, then the wrapper (trusted publishing, provenance)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          # Only for a first publish that npm trusted publishing cannot do; delete the secret after.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            ( umask 077; printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >"$RUNNER_TEMP/npmrc" )
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          fi
          disttag=latest
          [ "$PRERELEASE" = true ] && disttag=next
          publish() {
            dir=dist/npm/$(basename "$1")
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
              return 0
            fi
            npm publish "./$dir" --provenance --access public --tag "$disttag"
          }
          # relgen prints the wrapper first; it goes last so its optionalDependencies exist.
          for d in $(tail -n +2 dist/npm-dirs.txt); do publish "$d"; done
          publish "$(head -n 1 dist/npm-dirs.txt)"

  brew:
    name: brew
    needs: [verify, publish-release]
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/release
      - name: the tap (the token is used by this checkout and the push below)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mirastacklabs-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true
      - name: render the formula from checksums.txt and the archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          scripts/dev.sh go run ./tools/relgen brew -dist dist/release -checksums dist/release/checksums.txt -out tap/Formula/mirafleet.rb "$TAG"
      - name: push to the tap
        working-directory: tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "mirafleet release"
          git config user.email "opensource@mirastacklabs.ai"
          git add Formula/mirafleet.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -s -m "mirafleet $TAG"
          git push origin HEAD

  mcp-registry:
    name: mcp-registry
    needs: [verify, npm]
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mcp-publisher v1.8.9 (pinned by sha256)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          echo "4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/mcp"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp" mcp-publisher
      - name: login with GitHub OIDC and publish server.json
        run: |
          "$RUNNER_TEMP/mcp/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp/mcp-publisher" publish
