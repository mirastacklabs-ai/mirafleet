<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 776" width="840" height="776" role="img" aria-labelledby="t d">
<title id="t">Framing: a 4-byte length, then JSON</title>
<desc id="d">On an SSH channel every message is a frame: four bytes giving the payload length in big-endian order, followed by that many bytes of JSON. The example request is 33 bytes, so its header is 00 00 00 21. The response uses the same framing.</desc>
<style>
