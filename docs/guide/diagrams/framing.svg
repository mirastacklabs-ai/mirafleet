<text class="m" x="230" y="494">[4-byte length][raw bytes]: not JSON</text>
<text class="m" x="230" y="512">up to 1 MiB, right behind the request</text>
<path class="br" d="M13,530v6h88v-6"/><path class="br" d="M105,530v6h110v-6"/>
<circle class="bdg" cx="24" cy="556" r="11"/><text class="bt" x="24" y="560.5">7</text><text x="40" y="561">length = 5</text>
</g>
<g class="st" style="--i:8"><circle class="bdg" cx="150" cy="556" r="11"/><text class="bt" x="150" y="560.5">8</text><text x="168" y="561">read only AFTER the checks pass</text></g>
<circle class="dot pk" cx="0" cy="0" r="7"/>

<text class="h" x="10" y="598">Steps</text>
<g class="st" style="--i:1"><text x="10" y="622"><tspan class="b">1</tspan> The operator builds the JSON request: 33 bytes. Hex above, letters below each byte.</text></g>
<g class="st" style="--i:2"><text x="10" y="642"><tspan class="b">2</tspan> It puts the payload length first, as 4 bytes, big-endian: 33 = 0x00000021.</text></g>
<g class="st" style="--i:3"><text x="10" y="662"><tspan class="b">3</tspan> Header and payload go out in one Write on the channel.</text></g>
<g class="st" style="--i:4"><text x="10" y="682"><tspan class="b">4</tspan> Central reads 4 bytes, checks the length against its limit BEFORE allocating, reads that many.</text></g>
<g class="st" style="--i:5"><text x="10" y="702"><tspan class="b">5</tspan> Central runs the method and builds the JSON response (a small example: 28 bytes).</text></g>
<g class="st" style="--i:6"><text x="10" y="722"><tspan class="b">6</tspan> The response is framed the same way: 28 = 0x0000001C. The operator reads it back.</text></g>
<g class="st" style="--i:7"><text x="10" y="742"><tspan class="b">7</tspan> write_file and stdin add a body frame right behind the request: 4-byte length, then raw bytes.</text></g>
<g class="st" style="--i:8"><text x="10" y="762"><tspan class="b">8</tspan> Central reads it ONLY after policy, ownership and confirm pass; a slow sender is cut off at 30 s.</text></g>
</svg>
