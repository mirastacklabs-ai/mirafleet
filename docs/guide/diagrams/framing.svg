<text class="h" x="10" y="458">Body frame (M3): after a write_file request, 5 bytes &quot;hello&quot;</text>
<g class="st" style="--i:7">
<rect class="cph" x="13" y="476" width="22" height="46"/><text class="hh" x="24" y="496">00</text><text class="as" x="24" y="514">·</text>
