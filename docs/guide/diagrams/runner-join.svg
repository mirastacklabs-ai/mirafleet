<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" width="840" height="600" role="img" aria-labelledby="t d">
<title id="t">Runner join: token, pinned enroll connection, pending, approve</title>
<desc id="d">Dana, the admin, creates a join token, hands it to the runner host, the runner opens an enroll SSH connection that checks central's host key against the hash inside the token, sends a join frame, Store.Enroll inserts the runner as pending, Dana approves, and the runner reconnects as runner and heartbeats.</desc>
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--band:#F6F5F1;--ink:#0A0A0A;--text:#1C1C1C;--muted:#5E5E5E;--line:#E4E2DC;--accent:#00695F;--signal:#FF671F;--ok:#00695F;--okbg:#E0F0EE;--warn:#8A5300;--warnbg:#FBEFDC;--bad:#B42318;--badbg:#FDE8E6}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--surface:#191919;--band:#000000;--ink:#FFFFFF;--text:#E6E6E6;--muted:#8F8F8F;--line:#272727;--accent:#2BD4BF;--signal:#FF671F;--ok:#2BD4BF;--okbg:#0F2C29;--warn:#F0B45A;--warnbg:#2E2410;--bad:#FF8A7A;--badbg:#3A1715}}
svg{--T:12s;--slot:1.5s}
.bg{fill:#FFFFFF;fill:var(--bg,#FFFFFF)}
.pn{fill:#FFFFFF;fill:var(--surface,#FFFFFF);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
.bx{fill:#F6F5F1;fill:var(--band,#F6F5F1);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
text{font:400 13px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#1C1C1C;fill:var(--text,#1C1C1C)}
.ttl{font:600 21px Oswald,"Arial Narrow",Arial,sans-serif;text-transform:uppercase;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.h{font-weight:600;letter-spacing:.12em;text-transform:uppercase;fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.m{fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.b{font-weight:700;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.ln{stroke:#00695F;stroke:var(--accent,#00695F);stroke-width:2;fill:none}
.lnd{stroke:#5E5E5E;stroke:var(--muted,#5E5E5E);stroke-width:2;fill:none;stroke-dasharray:5 4}
.ahp{fill:#00695F;fill:var(--accent,#00695F)}
.ahm{fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.dot{fill:#FF671F;fill:var(--signal,#FF671F)}
.bdg{fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.bt{font-weight:700;fill:#FFFFFF;fill:var(--bg,#FFFFFF);text-anchor:middle}
.chw{fill:#FBEFDC;fill:var(--warnbg,#FBEFDC);stroke:#8A5300;stroke:var(--warn,#8A5300)}
.cho{fill:#E0F0EE;fill:var(--okbg,#E0F0EE);stroke:#00695F;stroke:var(--ok,#00695F)}
.tw{fill:#8A5300;fill:var(--warn,#8A5300);font-weight:700}
.to{fill:#00695F;fill:var(--ok,#00695F);font-weight:700}
.rule{stroke:#FF671F;stroke:var(--signal,#FF671F);stroke-width:2}
.pk{display:none}
@media (prefers-reduced-motion:no-preference){
.st{animation:lit var(--T) linear infinite both;animation-delay:calc((var(--i) - 1) * var(--slot))}
.pk{display:inline;animation:mv var(--T) linear infinite}
}
@keyframes lit{0%{opacity:.25}1%{opacity:1}11.5%{opacity:1}12.5%{opacity:.25}100%{opacity:.25}}
@keyframes mv{0%{transform:translate(130px,90px)}10.4%,12.5%{transform:translate(500px,90px)}12.6%{transform:translate(60px,170px)}22%,25%{transform:translate(60px,198px)}25.1%{transform:translate(250px,240px)}35%,37.5%{transform:translate(500px,240px)}37.6%{transform:translate(250px,290px)}47%,50%{transform:translate(500px,290px)}59%,62.5%{transform:translate(675px,190px)}68%{transform:translate(520px,330px)}75%{transform:translate(250px,330px)}75.1%{transform:translate(220px,120px)}85%,87.5%{transform:translate(500px,120px)}87.6%{transform:translate(250px,360px)}97%,100%{transform:translate(500px,360px)}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0L10,5L0,10z"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahm" d="M0,0L10,5L0,10z"/></marker>
</defs>
<rect class="bg" width="840" height="600"/>
<text class="ttl" x="10" y="32">A runner joins the fleet</text>
<line class="rule" x1="10" y1="42" x2="70" y2="42"/>

<!-- admin -->
<rect class="pn" x="10" y="56" width="230" height="110" rx="4"/>
<text class="h" x="22" y="78">Dana on central</text>
<text x="22" y="98">central token create</text>
<text class="m" x="22" y="118">prints once:</text>
<text class="b" x="22" y="136">mfj1.ID.SECRET.HASH</text>
<text class="m" x="22" y="154">HASH = host-key sha256</text>

<!-- runner -->
<rect class="pn" x="10" y="200" width="230" height="170" rx="4"/>
<text class="h" x="22" y="222">Runner host</text>
<text x="22" y="244">name: build-1</text>
<text x="22" y="264">makes its own ed25519</text>
<text x="22" y="280">key (private, stays here)</text>
<text class="m" x="22" y="306">holds the mfj1 token</text>
<text class="m" x="22" y="324">pins central by HASH,</text>
<text class="m" x="22" y="340">writes known_hosts</text>

<!-- central -->
<rect class="pn" x="520" y="56" width="310" height="320" rx="4"/>
<text class="h" x="532" y="78">Central</text>
<rect class="bx" x="530" y="88" width="290" height="26" rx="2"/>
<text x="540" y="106">SSH server :2222</text>
<rect class="bx" x="530" y="124" width="290" height="140" rx="2"/>
<text class="b" x="540" y="144">Store.Enroll (one tx)</text>
<text x="540" y="166">a look up token by ID</text>
<text x="540" y="184">b compare sha256(SECRET),</text>
<text x="540" y="200">  constant time</text>
<text x="540" y="218">c count a use (refuse if stale)</text>
<text x="540" y="236">d key not an operator? insert</text>
<g class="st" style="--i:6"><rect class="chw" x="530" y="276" width="110" height="26" rx="2"/><text class="tw" x="542" y="294">pending</text></g>
<line class="lnd" x1="644" y1="289" x2="696" y2="289" marker-end="url(#am)"/>
<g class="st" style="--i:7"><rect class="cho" x="700" y="276" width="110" height="26" rx="2"/><text class="to" x="712" y="294">active</text></g>
<rect class="bx" x="530" y="318" width="290" height="40" rx="2"/>
<g class="st" style="--i:8"><text x="540" y="342">registry: heartbeats arrive</text></g>

<!-- arrows -->
<g class="st" style="--i:1">
<line class="ln" x1="242" y1="90" x2="518" y2="90" marker-end="url(#ah)"/>
<text x="252" y="82">via admin socket</text>
<circle class="bdg" cx="470" cy="90" r="11"/><text class="bt" x="470" y="94.5">1</text>
</g>
<g class="st" style="--i:2">
<line class="lnd" x1="60" y1="168" x2="60" y2="198" marker-end="url(#am)"/>
<circle class="bdg" cx="36" cy="183" r="11"/><text class="bt" x="36" y="187.5">2</text>
<text x="84" y="187">hand over, not via central</text>
</g>
<g class="st" style="--i:3">
<line class="ln" x1="242" y1="240" x2="518" y2="240" marker-end="url(#ah)"/>
<text x="252" y="232">ssh user=enroll</text>
<text class="m" x="252" y="258">host key sha256 == HASH ?</text>
<circle class="bdg" cx="470" cy="232" r="11"/><text class="bt" x="470" y="236.5">3</text>
</g>
<g class="st" style="--i:4">
<line class="ln" x1="242" y1="290" x2="518" y2="290" marker-end="url(#ah)"/>
<text x="252" y="282">join@mirafleet frame</text>
<text class="m" x="252" y="308">token, name, labels</text>
<circle class="bdg" cx="470" cy="282" r="11"/><text class="bt" x="470" y="286.5">4</text>
</g>
<g class="st" style="--i:5"><circle class="bdg" cx="806" cy="136" r="11"/><text class="bt" x="806" y="140.5">5</text></g>
<g class="st" style="--i:6">
<line class="ln" x1="518" y1="330" x2="244" y2="330" marker-end="url(#ah)"/>
<text x="252" y="322">reply: pending</text>
<circle class="bdg" cx="470" cy="322" r="11"/><text class="bt" x="470" y="326.5">6</text>
</g>
<g class="st" style="--i:7">
<line class="ln" x1="242" y1="120" x2="518" y2="120" marker-end="url(#ah)"/>
<text x="252" y="112">runner approve dev/build-1</text>
<circle class="bdg" cx="470" cy="136" r="11"/><text class="bt" x="470" y="140.5">7</text>
</g>
<g class="st" style="--i:8">
<line class="ln" x1="242" y1="360" x2="518" y2="360" marker-end="url(#ah)"/>
<text x="252" y="352">ssh user=runner + heartbeat</text>
<circle class="bdg" cx="470" cy="376" r="11"/><text class="bt" x="470" y="380.5">8</text>
</g>
<circle class="dot pk" cx="0" cy="0" r="7"/>

<!-- steps -->
<text class="h" x="10" y="410">Steps</text>
<g class="st" style="--i:1"><text x="10" y="434"><tspan class="b">1</tspan> Dana runs token create on central. It prints mfj1.ID.SECRET.HASH once (HASH pins central).</text></g>
<g class="st" style="--i:2"><text x="10" y="454"><tspan class="b">2</tspan> Dana hands the token to the build-1 host by any channel, never through central.</text></g>
<g class="st" style="--i:3"><text x="10" y="474"><tspan class="b">3</tspan> runner join dials :2222 as user enroll. A host key not matching HASH is refused (no TOFU).</text></g>
<g class="st" style="--i:4"><text x="10" y="494"><tspan class="b">4</tspan> It sends one join@mirafleet frame: token, runner name, labels.</text></g>
<g class="st" style="--i:5"><text x="10" y="514"><tspan class="b">5</tspan> Store.Enroll, one transaction: look up by ID, constant-time compare, check stale, insert.</text></g>
<g class="st" style="--i:6"><text x="10" y="534"><tspan class="b">6</tspan> Status is pending (active only if the token auto-approves). The enroll connection closes.</text></g>
<g class="st" style="--i:7"><text x="10" y="554"><tspan class="b">7</tspan> Dana runs runner approve dev/build-1: status becomes active.</text></g>
<g class="st" style="--i:8"><text x="10" y="574"><tspan class="b">8</tspan> The runner reconnects as user runner with its own key and sends heartbeats.</text></g>
</svg>
