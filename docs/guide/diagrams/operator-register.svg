<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 572" width="840" height="572" role="img" aria-labelledby="t d">
<title id="t">Operator registration: a code that changes every 60 seconds</title>
<desc id="d">Three 60 second windows each have a different code made by HMAC-SHA256 of a secret and the window number. durga and kalyan register in the first window with the same code. kalyan tries the old code in the next window and is refused. The code also carries the host-key hash that pins central.</desc>
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--band:#F6F5F1;--ink:#0A0A0A;--text:#1C1C1C;--muted:#5E5E5E;--line:#E4E2DC;--accent:#00695F;--signal:#FF671F;--ok:#00695F;--okbg:#E0F0EE;--warn:#8A5300;--warnbg:#FBEFDC;--bad:#B42318;--badbg:#FDE8E6}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--surface:#191919;--band:#000000;--ink:#FFFFFF;--text:#E6E6E6;--muted:#8F8F8F;--line:#272727;--accent:#2BD4BF;--signal:#FF671F;--ok:#2BD4BF;--okbg:#0F2C29;--warn:#F0B45A;--warnbg:#2E2410;--bad:#FF8A7A;--badbg:#3A1715}}
svg{--T:14s;--slot:2s}
.bg{fill:#FFFFFF;fill:var(--bg,#FFFFFF)}
.pn{fill:#FFFFFF;fill:var(--surface,#FFFFFF);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
.bx{fill:#F6F5F1;fill:var(--band,#F6F5F1);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
text{font:400 13px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#1C1C1C;fill:var(--text,#1C1C1C)}
.ttl{font:600 21px Oswald,"Arial Narrow",Arial,sans-serif;text-transform:uppercase;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.h{font-weight:600;letter-spacing:.12em;text-transform:uppercase;fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.m{fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.b{font-weight:700;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.ac{fill:#00695F;fill:var(--accent,#00695F);font-weight:700}
.dot{fill:#FF671F;fill:var(--signal,#FF671F)}
.bdg{fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.bt{font-weight:700;fill:#FFFFFF;fill:var(--bg,#FFFFFF);text-anchor:middle}
.cok{fill:#E0F0EE;fill:var(--okbg,#E0F0EE);stroke:#00695F;stroke:var(--ok,#00695F)}
.cbad{fill:#FDE8E6;fill:var(--badbg,#FDE8E6);stroke:#B42318;stroke:var(--bad,#B42318)}
.tok{fill:#00695F;fill:var(--ok,#00695F);font-weight:700}
.tbad{fill:#B42318;fill:var(--bad,#B42318);font-weight:700}
.win{fill:#FFFFFF;fill:var(--surface,#FFFFFF);stroke:#00695F;stroke:var(--accent,#00695F);stroke-width:1}
.rule{stroke:#FF671F;stroke:var(--signal,#FF671F);stroke-width:2}
.pk{display:none}
@media (prefers-reduced-motion:no-preference){
.st{animation:lit var(--T) linear infinite both;animation-delay:calc((var(--i) - 1) * var(--slot))}
.pk{display:inline;animation:mv var(--T) linear infinite}
}
@keyframes lit{0%{opacity:.25}1%{opacity:1}13.3%{opacity:1}14.29%{opacity:.25}100%{opacity:.25}}
@keyframes mv{0%,14.29%{transform:translate(30px,76px)}20%,28.57%{transform:translate(140px,178px)}34%,42.86%{transform:translate(120px,224px)}48.5%,57.14%{transform:translate(120px,260px)}63%,71.43%{transform:translate(410px,178px)}77%,85.71%{transform:translate(400px,224px)}91%,100%{transform:translate(200px,336px)}}
</style>
<rect class="bg" width="840" height="572"/>
<text class="ttl" x="10" y="32">Operator registration code</text>
<line class="rule" x1="10" y1="42" x2="70" y2="42"/>

<!-- secret + formula -->
<rect class="pn" x="10" y="56" width="820" height="48" rx="4"/>
<g class="st" style="--i:1"><text class="b" x="22" y="76">Central secret: 32 random bytes (SQLite settings)</text><circle class="bdg" cx="806" cy="70" r="11"/><text class="bt" x="806" y="74.5">1</text></g>
<g class="st" style="--i:2"><text x="22" y="94">code(s) = mfr1. base32(HMAC-SHA256(secret, s))[:26] . HASH</text></g>

<!-- windows -->
<rect class="win" x="10" y="116" width="262" height="80" rx="4"/>
<rect class="win" x="284" y="116" width="262" height="80" rx="4"/>
<rect class="win" x="558" y="116" width="262" height="80" rx="4"/>
<text class="h" x="22" y="138">Window s</text>
<text class="h" x="296" y="138">Window s+1</text>
<text class="h" x="570" y="138">Window s+2</text>
<text class="m" x="22" y="158">seconds 0 to 59</text>
<text class="m" x="296" y="158">seconds 60 to 119</text>
<text class="m" x="570" y="158">seconds 120 to 179</text>
<text class="ac" x="22" y="182">mfr1.7QH3KD...HASH</text>
<text class="ac" x="296" y="182">mfr1.M2ZDW4...HASH</text>
<text class="ac" x="570" y="182">mfr1.Q8TAXN...HASH</text>
<g class="st" style="--i:2"><circle class="bdg" cx="250" cy="130" r="11"/><text class="bt" x="250" y="134.5">2</text></g>
<g class="st" style="--i:5"><circle class="bdg" cx="524" cy="130" r="11"/><text class="bt" x="524" y="134.5">5</text></g>

<!-- attempts -->
<g class="st" style="--i:3">
<rect class="cok" x="20" y="210" width="242" height="28" rx="2"/>
<text class="tok" x="30" y="229">durga  code 7QH3  OK</text>
<circle class="bdg" cx="246" cy="224" r="11"/><text class="bt" x="246" y="228.5">3</text>
</g>
<g class="st" style="--i:4">
<rect class="cok" x="20" y="246" width="242" height="28" rx="2"/>
<text class="tok" x="30" y="265">kalyan    code 7QH3  OK</text>
<circle class="bdg" cx="246" cy="260" r="11"/><text class="bt" x="246" y="264.5">4</text>
</g>
<g class="st" style="--i:6">
<rect class="cbad" x="294" y="210" width="242" height="28" rx="2"/>
<text class="tbad" x="304" y="229">kalyan    code 7QH3  REFUSED</text>
<circle class="bdg" cx="520" cy="224" r="11"/><text class="bt" x="520" y="228.5">6</text>
</g>
<text class="m" x="22" y="292">same window, same code: both accepted</text>
<text class="m" x="296" y="260">old code is dead once its</text>
<text class="m" x="296" y="276">window ends</text>
<text class="m" x="570" y="230">a new code every 60 s...</text>

<!-- central check -->
<g class="st" style="--i:7">
<rect class="pn" x="10" y="308" width="820" height="72" rx="4"/>
<text class="h" x="22" y="328">Central checks</text>
<text x="22" y="348">1 recompute the code for the current window only</text>
<text x="22" y="366">2 constant-time compare   3 HASH == its own host-key hash</text>
<circle class="bdg" cx="806" cy="322" r="11"/><text class="bt" x="806" y="326.5">7</text>
</g>
<circle class="dot pk" cx="0" cy="0" r="7"/>

<!-- steps -->
<text class="h" x="10" y="410">Steps</text>
<g class="st" style="--i:1"><text x="10" y="434"><tspan class="b">1</tspan> Central keeps a 32-byte secret in SQLite, never logged. Only aarvee (the admin) can read codes.</text></g>
<g class="st" style="--i:2"><text x="10" y="454"><tspan class="b">2</tspan> Each 60 s window s (unix seconds / 60) has its own code: base32(HMAC-SHA256(secret, s)) + HASH.</text></g>
<g class="st" style="--i:3"><text x="10" y="474"><tspan class="b">3</tspan> durga runs mcp login with the code aarvee gave durga. Central recomputes this window's code and compares.</text></g>
<g class="st" style="--i:4"><text x="10" y="494"><tspan class="b">4</tspan> kalyan uses the same code in the same window and is accepted too. Codes are not single-use.</text></g>
<g class="st" style="--i:5"><text x="10" y="514"><tspan class="b">5</tspan> The window ends. The next window s+1 has a brand-new code.</text></g>
<g class="st" style="--i:6"><text x="10" y="534"><tspan class="b">6</tspan> kalyan tries the old code in the next window: refused, with the same error as any wrong code.</text></g>
<g class="st" style="--i:7"><text x="10" y="554"><tspan class="b">7</tspan> HASH is central's host-key hash, so the code also pins central: no TOFU at first login.</text></g>
</svg>
