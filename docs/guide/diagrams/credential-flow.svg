<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img" aria-labelledby="t d">
<title id="t">Credential flow: assign, sync, use, rotate</title>
<desc id="d">Top row: aarvee stores gl-token on central with credential set; the value is sealed with AES-256-GCM and never shown again; aarvee assigns it to runner vm1-dev or to fleet dev; central pushes the effective set to the runner with creds_sync over the runner's own SSH connection and the runner keeps it in memory only; at session open the runner wires a restricted ssh-agent and an HTTPS broker. Bottom row: when the agent runs git, the agent signs or the broker injects the header and the agent never sees the value; the runner logs each use locally and sends aggregated credential.use events to central; aarvee replaces the value, or central rotates a GitLab token by itself; creds_sync sends the new set, the runner replaces it atomically and the next request uses the new value, and an unassigned credential stops working at once.</desc>
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--band:#F6F5F1;--ink:#0A0A0A;--text:#1C1C1C;--muted:#5E5E5E;--line:#E4E2DC;--accent:#00695F;--signal:#FF671F;--ok:#00695F;--okbg:#E0F0EE;--warn:#8A5300;--warnbg:#FBEFDC;--bad:#B42318;--badbg:#FDE8E6}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--surface:#191919;--band:#000000;--ink:#FFFFFF;--text:#E6E6E6;--muted:#8F8F8F;--line:#272727;--accent:#2BD4BF;--signal:#FF671F;--ok:#2BD4BF;--okbg:#0F2C29;--warn:#F0B45A;--warnbg:#2E2410;--bad:#FF8A7A;--badbg:#3A1715}}
svg{--T:12s;--slot:1.5s}
.bg{fill:#FFFFFF;fill:var(--bg,#FFFFFF)}
.pn{fill:#FFFFFF;fill:var(--surface,#FFFFFF);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
.okb{fill:#E0F0EE;fill:var(--okbg,#E0F0EE);stroke:#00695F;stroke:var(--ok,#00695F);stroke-width:1}
.wnb{fill:#FBEFDC;fill:var(--warnbg,#FBEFDC);stroke:#8A5300;stroke:var(--warn,#8A5300);stroke-width:1}
text{font:400 12px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#1C1C1C;fill:var(--text,#1C1C1C)}
.ttl{font:600 21px Oswald,"Arial Narrow",Arial,sans-serif;text-transform:uppercase;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.h{font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.m{fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.b{font-weight:700;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.to{fill:#00695F;fill:var(--ok,#00695F);font-weight:700}
.ln{stroke:#00695F;stroke:var(--accent,#00695F);stroke-width:2;fill:none}
.ahp{fill:#00695F;fill:var(--accent,#00695F)}
.bdg{fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.bt{font-weight:700;fill:#FFFFFF;fill:var(--bg,#FFFFFF);text-anchor:middle}
.rule{stroke:#FF671F;stroke:var(--signal,#FF671F);stroke-width:2}
@media (prefers-reduced-motion:no-preference){
.st{animation:lit var(--T) linear infinite both;animation-delay:calc((var(--i) - 1) * var(--slot))}
}
@keyframes lit{0%{opacity:.25}1%{opacity:1}11.5%{opacity:1}12.5%{opacity:.25}100%{opacity:.25}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="bg" width="840" height="520"/>
<text class="ttl" x="10" y="32">Credential flow: assign, sync, use, rotate</text>
<line class="rule" x1="10" y1="42" x2="70" y2="42"/>

<text class="h" x="10" y="64">Put it there</text>
<g class="st" style="--i:1">
<rect class="pn" x="10" y="72" width="188" height="108" rx="4"/>
<circle class="bdg" cx="178" cy="90" r="11"/><text class="bt" x="178" y="94.5">1</text>
<text class="b" x="18" y="92">aarvee, on central</text>
<text x="18" y="112">credential set gl-token</text>
<text class="to" x="18" y="130">sealed AES-256-GCM</text>
<text class="m" x="18" y="148">never shown again</text>
</g>
<g class="st" style="--i:2">
<line class="ln" x1="200" y1="126" x2="226" y2="126" marker-end="url(#ah)"/>
<rect class="pn" x="230" y="72" width="188" height="108" rx="4"/>
<circle class="bdg" cx="398" cy="90" r="11"/><text class="bt" x="398" y="94.5">2</text>
<text class="b" x="238" y="92">assign</text>
<text x="238" y="112">runner dev/vm1-dev</text>
<text x="238" y="128">or the whole fleet dev</text>
<text class="m" x="238" y="148">effective set = union</text>
</g>
<g class="st" style="--i:3">
<line class="ln" x1="420" y1="126" x2="446" y2="126" marker-end="url(#ah)"/>
<rect class="okb" x="450" y="72" width="188" height="108" rx="4"/>
<circle class="bdg" cx="618" cy="90" r="11"/><text class="bt" x="618" y="94.5">3</text>
<text class="b" x="458" y="92">creds_sync</text>
<text x="458" y="112">over the runner's own</text>
<text x="458" y="128">SSH connection</text>
<text class="to" x="458" y="148">held in memory only</text>
</g>
<g class="st" style="--i:4">
<line class="ln" x1="640" y1="126" x2="666" y2="126" marker-end="url(#ah)"/>
<rect class="pn" x="670" y="72" width="160" height="108" rx="4"/>
<circle class="bdg" cx="810" cy="90" r="11"/><text class="bt" x="810" y="94.5">4</text>
<text class="b" x="678" y="92">session open</text>
<text x="678" y="112">restricted ssh-agent</text>
<text x="678" y="128">+ HTTPS broker</text>
<text class="m" x="678" y="148">per session, local</text>
</g>

<text class="h" x="10" y="226">Use it, change it</text>
<g class="st" style="--i:5">
<path class="ln" d="M744,182 L744,204 L104,204 L104,238" marker-end="url(#ah)"/>
<rect class="okb" x="10" y="242" width="188" height="108" rx="4"/>
<circle class="bdg" cx="178" cy="260" r="11"/><text class="bt" x="178" y="264.5">5</text>
<text class="b" x="18" y="262">git clone / push</text>
<text x="18" y="282">agent signs, or broker</text>
<text x="18" y="298">adds the header</text>
<text class="to" x="18" y="318">agent sees no value</text>
</g>
<g class="st" style="--i:6">
<line class="ln" x1="200" y1="296" x2="226" y2="296" marker-end="url(#ah)"/>
<rect class="pn" x="230" y="242" width="188" height="108" rx="4"/>
<circle class="bdg" cx="398" cy="260" r="11"/><text class="bt" x="398" y="264.5">6</text>
<text class="b" x="238" y="262">use is logged</text>
<text x="238" y="282">runner JSONL, then</text>
<text x="238" y="298">credential.use rows</text>
<text class="m" x="238" y="318">60 s windows, source runner</text>
</g>
<g class="st" style="--i:7">
<line class="ln" x1="420" y1="296" x2="446" y2="296" marker-end="url(#ah)"/>
<rect class="wnb" x="450" y="242" width="188" height="108" rx="4"/>
<circle class="bdg" cx="618" cy="260" r="11"/><text class="bt" x="618" y="264.5">7</text>
<text class="b" x="458" y="262">rotate</text>
<text x="458" y="282">aarvee replaces value</text>
<text x="458" y="298">or central self-rotates</text>
<text class="m" x="458" y="318">GitLab token (opt-in)</text>
</g>
<g class="st" style="--i:8">
<line class="ln" x1="640" y1="296" x2="666" y2="296" marker-end="url(#ah)"/>
<rect class="okb" x="670" y="242" width="160" height="108" rx="4"/>
<circle class="bdg" cx="810" cy="260" r="11"/><text class="bt" x="810" y="264.5">8</text>
<text class="b" x="678" y="262">creds_sync again</text>
<text x="678" y="282">atomic swap</text>
<text class="to" x="678" y="298">used at once</text>
<text class="m" x="678" y="318">unassign: gone</text>
</g>

<g class="st" style="--i:1"><text x="10" y="384"><tspan class="b">1</tspan> aarvee sets the value from a file on stdin or in the GUI; central seals it and keeps no plaintext.</text></g>
<g class="st" style="--i:2"><text x="10" y="402"><tspan class="b">2</tspan> A credential is assigned to runners or fleets; a runner gets the union of both.</text></g>
<g class="st" style="--i:3"><text x="10" y="420"><tspan class="b">3</tspan> Central pushes the effective set on connect and on every change. Nothing is written to disk.</text></g>
<g class="st" style="--i:4"><text x="10" y="438"><tspan class="b">4</tspan> Each session gets its own agent socket and broker; the agent user sees neither value.</text></g>
<g class="st" style="--i:5"><text x="10" y="456"><tspan class="b">5</tspan> SSH: the agent signs. HTTPS: the broker injects the header on credential hosts only.</text></g>
<g class="st" style="--i:6"><text x="10" y="474"><tspan class="b">6</tspan> Every use is audited without the value: name, host, status, count.</text></g>
<g class="st" style="--i:7"><text x="10" y="492"><tspan class="b">7</tspan> A new value replaces the old one; expiry warnings start 14 days ahead.</text></g>
<g class="st" style="--i:8"><text x="10" y="510"><tspan class="b">8</tspan> The runner swaps the whole set atomically, so no restart and no stale value.</text></g>
</svg>
