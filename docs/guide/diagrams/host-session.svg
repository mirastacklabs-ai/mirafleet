<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img" aria-labelledby="t d">
<title id="t">Host mode: open, session directory, reattach</title>
<desc id="d">Top row, open: the agent calls workspace_open with session cc:abc; central checks that no other operator holds the runner and picks vm1-dev; the runner creates the session directory under its root with mode 0700 and a metadata file in its state directory; the runner then starts the per-session ssh-agent socket and HTTPS broker and sets the tool environment. Bottom row: bash and background jobs run as the runner's own user in the session directory; workspace_close kills the process groups and closes the socket and broker but keeps the directory; a later workspace_open with the same session id (or a runner restart) reattaches the same directory, current directory and jobs; the daily sweep deletes directories unused for 30 days, with a warning 3 days before, and workspace_close with delete true deletes at once.</desc>
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--band:#F6F5F1;--ink:#0A0A0A;--text:#1C1C1C;--muted:#5E5E5E;--line:#E4E2DC;--accent:#00695F;--signal:#FF671F;--ok:#00695F;--okbg:#E0F0EE;--warn:#8A5300;--warnbg:#FBEFDC;--bad:#B42318;--badbg:#FDE8E6}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--surface:#191919;--band:#000000;--ink:#FFFFFF;--text:#E6E6E6;--muted:#8F8F8F;--line:#272727;--accent:#2BD4BF;--signal:#FF671F;--ok:#2BD4BF;--okbg:#0F2C29;--warn:#F0B45A;--warnbg:#2E2410;--bad:#FF8A7A;--badbg:#3A1715}}
svg{--T:12s;--slot:1.5s}
.bg{fill:#FFFFFF;fill:var(--bg,#FFFFFF)}
.pn{fill:#FFFFFF;fill:var(--surface,#FFFFFF);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
.okb{fill:#E0F0EE;fill:var(--okbg,#E0F0EE);stroke:#00695F;stroke:var(--ok,#00695F);stroke-width:1}
.wnb{fill:#FBEFDC;fill:var(--warnbg,#FBEFDC);stroke:#8A5300;stroke:var(--warn,#8A5300);stroke-width:1}
text{font:400 12px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#1C1C1C;fill:var(--text,#1C1C1C)}
.ttl{font:600 21px Oswald,"Arial Narrow",Arial,sans-serif;text-transform:uppercase;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.h{font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.m{fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.b{font-weight:700;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.to{fill:#00695F;fill:var(--ok,#00695F);font-weight:700}
.ln{stroke:#00695F;stroke:var(--accent,#00695F);stroke-width:2;fill:none}
.ahp{fill:#00695F;fill:var(--accent,#00695F)}
.bdg{fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.bt{font-weight:700;fill:#FFFFFF;fill:var(--bg,#FFFFFF);text-anchor:middle}
.rule{stroke:#FF671F;stroke:var(--signal,#FF671F);stroke-width:2}
@media (prefers-reduced-motion:no-preference){
.st{animation:lit var(--T) linear infinite both;animation-delay:calc((var(--i) - 1) * var(--slot))}
}
@keyframes lit{0%{opacity:.25}1%{opacity:1}11.5%{opacity:1}12.5%{opacity:.25}100%{opacity:.25}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="bg" width="840" height="520"/>
<text class="ttl" x="10" y="32">Host mode: one session, one directory</text>
<line class="rule" x1="10" y1="42" x2="70" y2="42"/>

<text class="h" x="10" y="64">Open</text>
<g class="st" style="--i:1">
<rect class="pn" x="10" y="72" width="188" height="108" rx="4"/>
<circle class="bdg" cx="178" cy="90" r="11"/><text class="bt" x="178" y="94.5">1</text>
<text class="b" x="18" y="92">agent (alice's Mac)</text>
<text x="18" y="112">workspace_open</text>
<text class="to" x="18" y="130">session cc:abc</text>
<text class="m" x="18" y="148">no fleet path, no dir</text>
</g>
<g class="st" style="--i:2">
<line class="ln" x1="200" y1="126" x2="226" y2="126" marker-end="url(#ah)"/>
<rect class="pn" x="230" y="72" width="188" height="108" rx="4"/>
<circle class="bdg" cx="398" cy="90" r="11"/><text class="bt" x="398" y="94.5">2</text>
<text class="b" x="238" y="92">central</text>
<text x="238" y="112">runner not held by</text>
<text x="238" y="128">another operator</text>
<text class="m" x="238" y="148">has gl-token + deploy</text>
</g>
<g class="st" style="--i:3">
<line class="ln" x1="420" y1="126" x2="446" y2="126" marker-end="url(#ah)"/>
<rect class="okb" x="450" y="72" width="188" height="108" rx="4"/>
<circle class="bdg" cx="618" cy="90" r="11"/><text class="bt" x="618" y="94.5">3</text>
<text class="b" x="458" y="92">runner vm1-dev</text>
<text x="458" y="112">root/sessions/&lt;slug&gt;</text>
<text class="to" x="458" y="128">mode 0700</text>
<text class="m" x="458" y="148">meta: state/sessions/</text>
</g>
<g class="st" style="--i:4">
<line class="ln" x1="640" y1="126" x2="666" y2="126" marker-end="url(#ah)"/>
<rect class="pn" x="670" y="72" width="160" height="108" rx="4"/>
<circle class="bdg" cx="810" cy="90" r="11"/><text class="bt" x="810" y="94.5">4</text>
<text class="b" x="678" y="92">wiring</text>
<text x="678" y="112">agent.sock 0600</text>
<text x="678" y="128">broker + ca.pem</text>
<text class="m" x="678" y="148">SSH_AUTH_SOCK, proxy</text>
</g>

<text class="h" x="10" y="226">Use, close, come back</text>
<g class="st" style="--i:5">
<path class="ln" d="M744,182 L744,204 L104,204 L104,238" marker-end="url(#ah)"/>
<rect class="pn" x="10" y="242" width="188" height="108" rx="4"/>
<circle class="bdg" cx="178" cy="260" r="11"/><text class="bt" x="178" y="264.5">5</text>
<text class="b" x="18" y="262">bash, jobs, tools</text>
<text x="18" y="282">run as user dev</text>
<text x="18" y="298">cwd persists</text>
<text class="m" x="18" y="318">jobs in jobs/&lt;id&gt;</text>
</g>
<g class="st" style="--i:6">
<line class="ln" x1="200" y1="296" x2="226" y2="296" marker-end="url(#ah)"/>
<rect class="wnb" x="230" y="242" width="188" height="108" rx="4"/>
<circle class="bdg" cx="398" cy="260" r="11"/><text class="bt" x="398" y="264.5">6</text>
<text class="b" x="238" y="262">workspace_close</text>
<text x="238" y="282">kill process groups</text>
<text x="238" y="298">close socket, broker</text>
<text class="to" x="238" y="318">directory stays</text>
</g>
<g class="st" style="--i:7">
<line class="ln" x1="420" y1="296" x2="446" y2="296" marker-end="url(#ah)"/>
<rect class="okb" x="450" y="242" width="188" height="108" rx="4"/>
<circle class="bdg" cx="618" cy="260" r="11"/><text class="bt" x="618" y="264.5">7</text>
<text class="b" x="458" y="262">same session again</text>
<text x="458" y="282">workspace_open cc:abc</text>
<text class="to" x="458" y="298">or runner restart</text>
<text class="m" x="458" y="318">same files, cwd, jobs</text>
</g>
<g class="st" style="--i:8">
<line class="ln" x1="640" y1="296" x2="666" y2="296" marker-end="url(#ah)"/>
<rect class="wnb" x="670" y="242" width="160" height="108" rx="4"/>
<circle class="bdg" cx="810" cy="260" r="11"/><text class="bt" x="810" y="264.5">8</text>
<text class="b" x="678" y="262">cleanup</text>
<text x="678" y="282">unused 30 d: sweep</text>
<text x="678" y="298">warning at -3 d</text>
<text class="m" x="678" y="318">or close delete:true</text>
</g>

<g class="st" style="--i:1"><text x="10" y="384"><tspan class="b">1</tspan> The agent opens a workspace; the session id comes from the hook (chapter 4), not a path.</text></g>
<g class="st" style="--i:2"><text x="10" y="402"><tspan class="b">2</tspan> Central refuses a runner another operator holds, and a runner without a requested credential.</text></g>
<g class="st" style="--i:3"><text x="10" y="420"><tspan class="b">3</tspan> The runner makes the session directory (0700) and writes the session record in its state dir.</text></g>
<g class="st" style="--i:4"><text x="10" y="438"><tspan class="b">4</tspan> The ssh-agent socket and the HTTPS broker start for this session; the tool env points at them.</text></g>
<g class="st" style="--i:5"><text x="10" y="456"><tspan class="b">5</tspan> Tools run as the runner's own user. Foreground bash keeps the cwd; jobs outlive restarts.</text></g>
<g class="st" style="--i:6"><text x="10" y="474"><tspan class="b">6</tspan> Close stops processes and secrets access, never deletes files.</text></g>
<g class="st" style="--i:7"><text x="10" y="492"><tspan class="b">7</tspan> Reopening the session id, or restarting the runner, re-adopts the directory and running jobs.</text></g>
<g class="st" style="--i:8"><text x="10" y="510"><tspan class="b">8</tspan> Only the sweep, prune, kill -delete or close delete:true remove a directory.</text></g>
</svg>
