<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 592" width="840" height="592" role="img" aria-labelledby="t d">
<title id="t">Big picture: every connection points at central</title>
<desc id="d">Operator laptops and runners each dial out to central on SSH port 2222. Nothing listens on a runner. Keys are kept on the laptop, on central and on each runner.</desc>
<style>
:root{--bg:#FFFFFF;--surface:#FFFFFF;--band:#F6F5F1;--ink:#0A0A0A;--text:#1C1C1C;--muted:#5E5E5E;--line:#E4E2DC;--accent:#00695F;--signal:#FF671F;--ok:#00695F;--okbg:#E0F0EE;--warn:#8A5300;--warnbg:#FBEFDC;--bad:#B42318;--badbg:#FDE8E6}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--surface:#191919;--band:#000000;--ink:#FFFFFF;--text:#E6E6E6;--muted:#8F8F8F;--line:#272727;--accent:#2BD4BF;--signal:#FF671F;--ok:#2BD4BF;--okbg:#0F2C29;--warn:#F0B45A;--warnbg:#2E2410;--bad:#FF8A7A;--badbg:#3A1715}}
svg{--T:12s;--slot:2s}
.bg{fill:#FFFFFF;fill:var(--bg,#FFFFFF)}
.pn{fill:#FFFFFF;fill:var(--surface,#FFFFFF);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
.bx{fill:#F6F5F1;fill:var(--band,#F6F5F1);stroke:#E4E2DC;stroke:var(--line,#E4E2DC);stroke-width:1}
text{font:400 13px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#1C1C1C;fill:var(--text,#1C1C1C)}
.ttl{font:600 21px Oswald,"Arial Narrow",Arial,sans-serif;text-transform:uppercase;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.h{font-weight:600;letter-spacing:.12em;text-transform:uppercase;fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.m{fill:#5E5E5E;fill:var(--muted,#5E5E5E)}
.b{font-weight:700;fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.ac{fill:#00695F;fill:var(--accent,#00695F)}
.ln{stroke:#00695F;stroke:var(--accent,#00695F);stroke-width:2;fill:none}
.ahp{fill:#00695F;fill:var(--accent,#00695F)}
.dot{fill:#FF671F;fill:var(--signal,#FF671F)}
.bdg{fill:#0A0A0A;fill:var(--ink,#0A0A0A)}
.bt{font-weight:700;fill:#FFFFFF;fill:var(--bg,#FFFFFF);text-anchor:middle}
.key{fill:none;stroke:#00695F;stroke:var(--accent,#00695F);stroke-width:1}
.rule{stroke:#FF671F;stroke:var(--signal,#FF671F);stroke-width:2}
.pk{display:none}
@media (prefers-reduced-motion:no-preference){
.st{animation:lit var(--T) linear infinite both;animation-delay:calc((var(--i) - 1) * var(--slot))}
.pk{display:inline;animation:mv var(--T) linear infinite}
}
@keyframes lit{0%{opacity:.25}1%{opacity:1}15.5%{opacity:1}16.7%{opacity:.25}100%{opacity:.25}}
@keyframes mv{0%,14%{transform:translate(200px,130px)}25%,33.3%{transform:translate(418px,109px)}41%,49.9%{transform:translate(418px,157px)}50%{transform:translate(700px,111px)}62%,66.7%{transform:translate(500px,109px)}78%,83.3%{transform:translate(640px,111px)}83.4%{transform:translate(425px,376px)}94%,100%{transform:translate(425px,317px)}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0,0L10,5L0,10z"/></marker></defs>
<rect class="bg" width="840" height="592"/>
<text class="ttl" x="10" y="32">Every connection points at central</text>
<line class="rule" x1="10" y1="42" x2="70" y2="42"/>

<!-- laptop -->
<rect class="pn" x="10" y="56" width="220" height="200" rx="4"/>
<text class="h" x="22" y="78">Operator laptop</text>
<text x="22" y="104">Claude Code</text>
<text class="m" x="22" y="122">spawns mirafleet mcp</text>
<rect class="key" x="20" y="138" width="200" height="74" rx="2"/>
<text class="ac b" x="30" y="156">KEYS STAY HERE</text>
<text x="30" y="175">LLM API key</text>
<text x="30" y="192">operator ssh key</text>
<text class="m" x="30" y="207">known_hosts (pins)</text>
<text class="m" x="22" y="238">one laptop each: alice, bob</text>

<!-- central -->
<rect class="pn" x="330" y="56" width="190" height="290" rx="4"/>
<text class="h" x="342" y="78">Central</text>
<rect class="bx" x="342" y="92" width="166" height="34" rx="2"/>
<text x="352" y="114">SSH server :2222</text>
<g class="st" style="--i:3"><rect class="bx" x="342" y="140" width="166" height="34" rx="2" style="stroke:#00695F;stroke:var(--accent,#00695F)"/></g>
<text x="352" y="162">SQLite store</text>
<rect class="key" x="342" y="188" width="166" height="92" rx="2"/>
<text class="ac b" x="352" y="206">KEYS LIVE HERE</text>
<text x="352" y="225">host key (private)</text>
<text x="352" y="242">registration secret</text>
<text class="m" x="352" y="259">public keys in SQLite</text>
<rect class="bx" x="342" y="296" width="166" height="34" rx="2"/>
<text x="352" y="318">admin socket</text>

<!-- admin -->
<rect class="pn" x="330" y="376" width="190" height="46" rx="4"/>
<text x="342" y="396">admin CLI (Dana)</text>
<text class="m" x="342" y="413">runs on central host</text>

<!-- fleets -->
<rect class="pn" x="620" y="56" width="210" height="170" rx="4"/>
<text class="h" x="632" y="78">Fleet dev: workspace</text>
<text x="632" y="98">runner build-1</text>
<text class="m" x="632" y="114">listens on: nothing</text>
<rect class="key" x="630" y="124" width="190" height="36" rx="2"/>
<text x="640" y="140">runner ssh key +</text>
<text class="m" x="640" y="155">central host-key hash</text>
<rect class="bx" x="630" y="170" width="190" height="48" rx="2"/>
<text x="640" y="190">containerd (local)</text>
<text class="m" x="640" y="208">container: no keys</text>

<rect class="pn" x="620" y="244" width="210" height="112" rx="4"/>
<text class="h" x="632" y="266">Fleet prod: actions</text>
<text x="632" y="286">runner db-1</text>
<text class="m" x="632" y="302">listens on: nothing</text>
<rect class="key" x="630" y="312" width="190" height="36" rx="2"/>
<text x="640" y="328">runner ssh key +</text>
<text class="m" x="640" y="343">central host-key hash</text>

<!-- arrows: all dialled toward central -->
<g class="st" style="--i:2">
<line class="ln" x1="232" y1="130" x2="328" y2="130" marker-end="url(#ah)"/>
<text x="238" y="108">ssh :2222</text>
<text class="m" x="238" y="156">api@</text><text class="m" x="238" y="172">channel</text>
<circle class="bdg" cx="279" cy="130" r="11"/><text class="bt" x="279" y="134.5">2</text>
</g>
<g class="st" style="--i:4">
<line class="ln" x1="618" y1="111" x2="524" y2="111" marker-end="url(#ah)"/>
<line class="ln" x1="618" y1="299" x2="524" y2="299" marker-end="url(#ah)"/>
<text x="540" y="92">ssh :2222</text>
<text x="540" y="280">ssh :2222</text>
<circle class="bdg" cx="571" cy="111" r="11"/><text class="bt" x="571" y="115.5">4</text>
</g>
<g class="st" style="--i:5">
<text class="m" x="540" y="166">workspace@</text>
<text class="m" x="556" y="332">exec@</text>
<circle class="bdg" cx="536" cy="140" r="11"/><text class="bt" x="536" y="144.5">5</text>
</g>
<g class="st" style="--i:6">
<line class="ln" x1="425" y1="374" x2="425" y2="348" marker-end="url(#ah)"/>
<text class="m" x="440" y="366">local only</text>
<circle class="bdg" cx="402" cy="361" r="11"/><text class="bt" x="402" y="365.5">6</text>
</g>
<g class="st" style="--i:1"><circle class="bdg" cx="218" cy="66" r="11"/><text class="bt" x="218" y="70.5">1</text></g>
<g class="st" style="--i:3"><circle class="bdg" cx="500" cy="157" r="11"/><text class="bt" x="500" y="161.5">3</text></g>
<circle class="dot pk" cx="0" cy="0" r="7"/>

<!-- steps -->
<text class="h" x="10" y="448">Steps</text>
<g class="st" style="--i:1"><text x="10" y="472"><tspan class="b">1</tspan> Claude Code starts mirafleet mcp. The LLM API key and the SSH key stay on the laptop.</text></g>
<g class="st" style="--i:2"><text x="10" y="492"><tspan class="b">2</tspan> mcp dials central :2222 as SSH user operator; each request is one api@ channel.</text></g>
<g class="st" style="--i:3"><text x="10" y="512"><tspan class="b">3</tspan> Central checks the key and the policy against SQLite, then acts.</text></g>
<g class="st" style="--i:4"><text x="10" y="532"><tspan class="b">4</tspan> Runners dial OUT to central (user runner). Nothing listens on a runner.</text></g>
<g class="st" style="--i:5"><text x="10" y="552"><tspan class="b">5</tspan> Central sends work back down that same connection: exec@ (actions) or workspace@ (containers).</text></g>
<g class="st" style="--i:6"><text x="10" y="572"><tspan class="b">6</tspan> Dana runs the admin CLI on central. It uses a local unix socket, never the network.</text></g>
</svg>
